specVersion: "4.0"

metadata:
  name: inventory.ui.approvalsui

type: application

server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      configuration:
        baseUri: "http://localhost:8080"
        mountPath: "/service"

    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300